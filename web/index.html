
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大模型代码审计系统</title>
<style>
  :root {
    --bg: #f0f4fa;
    --bg-grad: linear-gradient(135deg, #eef2f9 0%, #f5f8fd 50%, #eef4ff 100%);
    --card: #ffffff;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --txt: #1e293b;
    --txt-2: #334155;
    --dim: #64748b;
    --dim-2: #94a3b8;
    --accent: #3b82f6;
    --accent-2: #6366f1;
    --accent-grad: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
    --accent-soft: #eff6ff;
    --accent-border: #bfdbfe;
    --ok: #10b981;
    --ok-soft: #ecfdf5;
    --err: #ef4444;
    --err-soft: #fef2f2;
    --warn: #f59e0b;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.06);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg-grad);
    color: var(--txt);
    font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 14px 28px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 16px;
    font-weight: 700;
    background: var(--accent-grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.3px;
  }
  header .env {
    margin-left: auto;
    font-size: 12px;
    color: var(--dim);
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18); }
  .dot.off { background: var(--dim-2); box-shadow: none; }
  main {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    padding: 20px 28px;
    height: calc(100vh - 56px);
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 20px;
    overflow: auto;
    box-shadow: var(--shadow-md);
    transition: box-shadow 0.3s ease;
  }
  .panel:hover {
    box-shadow: var(--shadow-lg);
  }
  .panel h2 {
    font-size: 13px;
    color: var(--dim);
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    position: relative;
    padding-left: 10px;
  }
  .panel h2::before {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 14px;
    background: var(--accent-grad);
    border-radius: 2px;
  }
  label {
    display: block;
    margin: 14px 0 6px;
    font-size: 12px;
    color: var(--txt-2);
    font-weight: 500;
  }
  input[type=text] {
    width: 100%;
    padding: 10px 14px;
    background: #f8fafc;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    color: var(--txt);
    font-size: 13px;
    transition: all 0.2s ease;
    outline: none;
  }
  input[type=text]:hover {
    border-color: var(--line-strong);
    background: #fff;
  }
  input[type=text]:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
  }
  input[type=text]::placeholder {
    color: var(--dim-2);
  }
  .pickrow {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .pickrow button {
    flex: 1;
    padding: 9px 0;
    background: #f8fafc;
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    color: var(--txt-2);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .pickrow button:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.15);
  }
  .pickrow button:active {
    transform: translateY(0);
  }
  .segs {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    background: #f1f5f9;
    padding: 4px;
    border-radius: var(--radius-md);
  }
  .segs button {
    flex: 1;
    padding: 8px 0;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .segs button:hover {
    color: var(--txt-2);
    background: rgba(255, 255, 255, 0.6);
  }
  .segs button.sel {
    color: var(--accent);
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }
  #run {
    width: 100%;
    margin-top: 18px;
    padding: 12px;
    background: var(--accent-grad);
    color: #fff;
    border: 0;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    letter-spacing: 0.5px;
  }
  #run:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
  }
  #run:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
  }
  #run:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--dim);
    min-height: 20px;
    padding: 6px 10px;
    background: #f8fafc;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
  }
  #status .spin {
    display: inline-block;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #log {
    margin-top: 10px;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: var(--radius-md);
    padding: 14px;
    font: 12px/1.7 "JetBrains Mono", Consolas, "Courier New", monospace;
    color: #94a3b8;
    height: calc(100% - 380px);
    min-height: 140px;
    overflow: auto;
    white-space: pre-wrap;
    position: relative;
  }
  #log::before {
    content: "";
    display: block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ef4444;
    position: absolute;
    top: 8px;
    left: 12px;
    box-shadow: 16px 0 0 #f59e0b, 32px 0 0 #10b981;
  }
  #out { position: relative; }
  #empty {
    color: var(--dim);
    text-align: center;
    margin-top: 30vh;
    font-size: 14px;
  }
  #empty small {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    color: var(--dim-2);
  }
  #frame {
    width: 100%;
    height: calc(100vh - 230px);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: #fff;
    box-shadow: var(--shadow-sm);
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    background: #f1f5f9;
    padding: 4px;
    border-radius: var(--radius-md);
    width: fit-content;
  }
  .tabs button {
    padding: 6px 18px;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--dim);
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .tabs button:hover {
    color: var(--txt-2);
    background: rgba(255, 255, 255, 0.6);
  }
  .tabs button.sel {
    color: var(--accent);
    background: #fff;
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }
  #stats {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    background: #f1f5f9;
    border: 1px solid var(--line);
    color: var(--txt-2);
    font-weight: 500;
  }
  .chip b {
    color: var(--txt);
    font-weight: 700;
    margin-left: 2px;
  }
  #errbox {
    display: none;
    background: var(--err-soft);
    border: 1px solid #fecaca;
    color: #b91c1c;
    padding: 12px 16px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    font-size: 13px;
    box-shadow: 0 1px 3px rgba(239, 68, 68, 0.1);
  }
  #md {
    display: none;
    height: calc(100vh - 230px);
    background: #f8fafc;
    border: 1px solid var(--line);
    padding: 18px;
    border-radius: var(--radius-md);
    font: 13px/1.7 "JetBrains Mono", Consolas, "Courier New", monospace;
    white-space: pre-wrap;
    overflow: auto;
    box-shadow: var(--shadow-sm);
    color: var(--txt-2);
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
  #log::-webkit-scrollbar-thumb {
    background: #334155;
  }
  #log::-webkit-scrollbar-thumb:hover {
    background: #475569;
  }
</style>
</head>
<body>
<header>
  <h1>🛡 基于大语言模型的代码审计系统</h1>
  <div class="env">
    <span id="env-llm"><span class="dot off"></span>模型未就绪</span>
    <span id="env-kb">知识库 …</span>
    <span id="env-rs">规则 …</span>
  </div>
</header>
<main>
  <section class="panel">
    <h2>审计配置</h2>
    <label>目标路径（.py 文件或文件夹）</label>
    <input type="text" id="target" placeholder="可点下方按钮选择，或粘贴路径">
    <div class="pickrow">
      <button id="pick-file">选择文件</button>
      <button id="pick-dir">选择文件夹</button>
    </div>
    <label>模式</label>
    <div class="segs" id="modes">
      <button data-v="static" class="sel">静态检查（免费）</button>
      <button data-v="ai">AI 深度审计</button>
    </div>
    <label>粒度（AI 模式生效）</label>
    <div class="segs" id="depths">
      <button data-v="file" class="sel">文件级</button>
      <button data-v="function">函数级</button>
      <button data-v="project">工程级</button>
    </div>
    <button id="run">开始审计</button>
    <div id="status"></div>
    <pre id="log">等待任务…</pre>
  </section>
  <section class="panel" id="out">
    <div id="empty">左侧选路径，开始第一次审计<br><small>静态检查免费秒出；AI 深度审计在右侧显示逐步进度</small></div>
    <div id="errbox"></div>
    <div id="stats" style="display:none"></div>
    <div class="tabs" id="tabs" style="display:none">
      <button class="sel" data-v="html">报告视图</button>
      <button data-v="md">Markdown 原文</button>
    </div>
    <iframe id="frame" style="display:none"></iframe>
    <div id="md"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let mode = "static", depth = "file", polling = null, tick = null, lastLog = "";

function seg(el, cb) {
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    el.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); cb(b.dataset.v);
  });
}
seg($("#modes"), v => mode = v);
seg($("#depths"), v => depth = v);
seg($("#tabs"), v => {
  const showFrame = v === "html";
  $("#frame").style.setProperty("display", showFrame ? "block" : "none", "important");
  $("#md").style.setProperty("display", showFrame ? "none" : "block", "important");
});

// 拖拽：阻止 webview 默认的"打开文件"导航；能拿到真实路径就填入，
// 拿不到（浏览器出于安全不提供 path）则提示改用选择按钮。
window.addEventListener("dragover", e => { e.preventDefault(); e.stopPropagation(); });
window.addEventListener("drop", e => {
  e.preventDefault(); e.stopPropagation();
  let p = "";
  try { p = e.dataTransfer && e.dataTransfer.files[0] ? (e.dataTransfer.files[0].path || "") : ""; } catch (_) {}
  if (p) { $("#target").value = p; $("#status").textContent = "已从拖入文件填入路径"; }
  else { $("#status").textContent = "拖拽无法获取路径，请用「选择文件 / 选择文件夹」按钮"; }
});
async function pick(kind) {
  try {
    const r = await (await fetch(`/api/pick?kind=${kind}`)).json();
    if (r.error) { $("#status").textContent = r.error; return; }
    if (r.path) $("#target").value = r.path;
  } catch (e) { $("#status").textContent = "选择框不可用，请手动输入路径"; }
}
$("#pick-file").onclick = () => pick("file");
$("#pick-dir").onclick = () => pick("dir");

fetch("/api/check").then(r => r.json()).then(c => {
  $("#env-llm").innerHTML = `<span class="dot ${c.llm_ready?"on":"off"}"></span>${c.llm_ready ? c.model : "模型未配置"}`;
  $("#env-kb").textContent = `知识库 ${c.knowledge} 条`;
  $("#env-rs").textContent = `规则 ${c.rules} 条`;
}).catch(() => {});

$("#run").onclick = async () => {
  const target = $("#target").value.trim();
  if (!target) { alert("请先选择或填入路径"); return; }
  $("#run").disabled = true; $("#empty").style.display = "none";
  $("#errbox").style.display = "none"; $("#log").textContent = "";
  $("#status").innerHTML = `<span class="spin">⏳</span> 启动任务…`;
  const r = await fetch("/api/audit", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({target, mode, depth})});
  const j = await r.json();
  if (!r.ok) { fail(j.detail || "启动失败"); return; }
  poll(j.job_id);
};

function poll(id) {
  const start = Date.now();
  clearInterval(polling); clearInterval(tick);
  tick = setInterval(() => {
    const s = ((Date.now() - start) / 1000).toFixed(0);
    $("#status").innerHTML = `<span class="spin">⏳</span> 运行中 ${s}s${mode === "ai" ? "（AI 逐单元调用，需耐心）" : ""}`;
  }, 1000);
  polling = setInterval(async () => {
    let s; try { s = await (await fetch(`/api/job/${id}`)).json(); } catch (_) { return; }
    if (s.progress && s.progress.join("\n") !== lastLog) {
      lastLog = s.progress.join("\n");
      $("#log").textContent = s.progress.join("\n");
      $("#log").scrollTop = $("#log").scrollHeight;
    }
    if (s.status === "done") { clearInterval(polling); clearInterval(tick); render(id); }
    else if (s.status === "error") { clearInterval(polling); clearInterval(tick); fail(s.error); }
  }, 1000);
}

async function render(id) {
  const d = await (await fetch(`/api/result/${id}`)).json();
  $("#frame").srcdoc = d.html;
  $("#md").textContent = d.markdown;
  const st = d.stats || {}, sv = st.by_severity || {};
  const sec = (sv["严重"]||sv.critical||0), high = (sv["高危"]||sv.high||0);
  const midlow = (sv["中危"]||sv.medium||0)+(sv["低危"]||sv.low||0);
  $("#status").textContent = "✔ 完成";
  $("#stats").style.display = "flex"; $("#tabs").style.display = "flex";
  $("#frame").style.setProperty("display", "block", "important");
  $("#md").style.setProperty("display", "none", "important");
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("sel", x.dataset.v === "html"));
  $("#stats").innerHTML =
    `<span class="chip">共 <b>${st.total ?? 0}</b> 条</span>` +
    `<span class="chip" style="color:#d05c5c">严重 <b>${sec}</b></span>` +
    `<span class="chip" style="color:#c07a1d">高危 <b>${high}</b></span>` +
    `<span class="chip" style="color:#5a7396">中低危 <b>${midlow}</b></span>` +
    `<span class="chip">引擎 ${d.engine.model || "?"}${d.engine.llm_used ? " · AI" : " · 纯静态"} · ${st.elapsed_sec ?? 0}s</span>`;
  $("#run").disabled = false;
}

function fail(msg) {
  $("#status").textContent = "";
  $("#errbox").textContent = "⚠ " + msg; $("#errbox").style.display = "block";
  $("#run").disabled = false;
}
</script>
</body>
</html>
